{% extends "base.html" %}
{% block body %}
<div class="min-h-screen bg-stone-50">
    <header class="border-b border-stone-200 bg-stone-900 text-white">
        <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8">
            <div class="flex items-center gap-3">
                <span class="flex h-9 w-9 items-center justify-center rounded-xl bg-white/10 text-lg">
                    <ion-icon name="shield-checkmark-outline"></ion-icon>
                </span>
                <div>
                    <p class="font-extrabold leading-tight">FarmIQ</p>
                    <p class="text-xs text-stone-400">Platform Admin</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-sm text-stone-300">{{ user.get_full_name }}</span>
                <form method="post" action="{% url 'accounts:logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="rounded-full border border-white/20 px-4 py-1.5 text-xs font-bold hover:bg-white/10">Sign out</button>
                </form>
            </div>
        </div>
    </header>
    <main class="mx-auto max-w-7xl px-6 py-8 lg:px-8">
        {% block admin_content %}{% endblock %}
    </main>
</div>
{% endblock %}
