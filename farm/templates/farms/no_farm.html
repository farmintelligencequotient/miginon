{% extends "app_base.html" %}
{% load i18n %}
{% block title %}{% trans "No farm" %} - FarmIQ{% endblock %}
{% block app_content %}
<div class="mx-auto max-w-md rounded-2xl border border-stone-200 bg-white p-8 text-center dark:border-stone-800 dark:bg-stone-900">
    <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-amber-50 text-2xl text-amber-600 dark:bg-amber-950 dark:text-amber-400">
        <ion-icon name="business-outline"></ion-icon>
    </div>
    <h1 class="text-xl font-extrabold text-stone-900 dark:text-stone-100">{% trans "You're not linked to a farm yet" %}</h1>
    <p class="mt-2 text-sm text-stone-500 dark:text-stone-400">{% trans "Ask your farm owner to add you back as a worker using this email address." %}</p>
</div>
{% endblock %}
