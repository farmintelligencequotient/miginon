{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're offline - Farm IQ</title>
    <!--
        This page must render without any network access, so unlike the rest
        of the app it can't pull Tailwind/Ionicons/fonts from a CDN - every
        style here is inline, and the only external asset is the app icon,
        which the service worker caches specifically so this page works.
    -->
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f4;
            color: #1c1917;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 24px;
        }
        .card {
            max-width: 380px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 10px 40px -12px rgba(20, 84, 60, 0.18);
        }
        .icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            margin: 0 auto 20px;
            display: block;
        }
        h1 {
            font-size: 20px;
            font-weight: 800;
            margin: 0 0 8px;
        }
        p {
            font-size: 14px;
            color: #78716c;
            line-height: 1.5;
            margin: 0 0 24px;
        }
        button {
            appearance: none;
            border: none;
            border-radius: 9999px;
            background: #047857;
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 12px 28px;
            cursor: pointer;
        }
        button:hover { background: #065f46; }
    </style>
</head>
<body>
    <div class="card">
        <img class="icon" src="{% static 'images/icons/icon-192x192.png' %}" alt="Miginon Farm">
        <h1>You're offline</h1>
        <p>Miginon Farm needs a connection to load your farm's records. Reconnect and try again - anything you already had open will still be there.</p>
        <button onclick="window.location.reload()">Try again</button>
    </div>
</body>
</html>
