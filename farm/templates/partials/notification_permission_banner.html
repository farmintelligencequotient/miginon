{% if vapid_public_key %}
<div id="push-banner" class="fixed inset-x-0 top-0 z-40 hidden w-full">
    <div class="w-full border-b border-emerald-100 bg-white px-4 py-5 shadow-soft sm:px-6">
        <div class="mx-auto flex max-w-3xl items-start gap-3">
            <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-emerald-50 text-lg text-emerald-700">
                <ion-icon name="notifications-outline"></ion-icon>
            </span>
            <div class="min-w-0 flex-1">
                <p class="text-sm font-bold text-stone-900">Turn on notifications</p>
                <p class="mt-1 text-xs leading-relaxed text-stone-500">
                    Get notified on this device when a task is assigned to you, a task you assigned is completed,
                    or an inventory item runs low - even when the app isn't open.
                </p>
                <div class="mt-3 flex gap-2">
                    <button id="push-enable-btn" type="button" class="flex items-center gap-1.5 rounded-full bg-emerald-700 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-800">
                        <ion-icon name="notifications-outline"></ion-icon> Enable
                    </button>
                    <button id="push-dismiss-btn" type="button" class="rounded-full border border-stone-200 px-4 py-2 text-xs font-bold text-stone-600 hover:bg-stone-50">
                        Not now
                    </button>
                </div>
            </div>
            <button id="push-close-btn" type="button" class="shrink-0 text-stone-400 hover:text-stone-600" aria-label="Dismiss">
                <ion-icon name="close-outline" class="text-lg"></ion-icon>
            </button>
        </div>
    </div>
</div>
{{ vapid_public_key|json_script:"vapid-public-key" }}

<script>
    (function () {
        var banner = document.getElementById('push-banner');
        if (!banner) return;
        if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return;
        if (Notification.permission !== 'default') return;

        var DISMISS_KEY = 'miginon_push_banner_dismissed';
        if (localStorage.getItem(DISMISS_KEY)) return;

        banner.classList.remove('hidden');

        function dismiss() {
            localStorage.setItem(DISMISS_KEY, '1');
            banner.classList.add('hidden');
        }
        document.getElementById('push-dismiss-btn').addEventListener('click', dismiss);
        document.getElementById('push-close-btn').addEventListener('click', dismiss);

        function urlBase64ToUint8Array(base64String) {
            var padding = '='.repeat((4 - (base64String.length % 4)) % 4);
            var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            var raw = atob(base64);
            var output = new Uint8Array(raw.length);
            for (var i = 0; i < raw.length; ++i) output[i] = raw.charCodeAt(i);
            return output;
        }

        function getCsrfToken() {
            var match = document.cookie.match(/(?:^|; )csrftoken=([^;]+)/);
            return match ? decodeURIComponent(match[1]) : '';
        }

        document.getElementById('push-enable-btn').addEventListener('click', function () {
            Notification.requestPermission().then(function (permission) {
                if (permission !== 'granted') { dismiss(); return; }
                var vapidKey = JSON.parse(document.getElementById('vapid-public-key').textContent);
                navigator.serviceWorker.ready.then(function (registration) {
                    return registration.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: urlBase64ToUint8Array(vapidKey),
                    });
                }).then(function (subscription) {
                    return fetch('{% url "notifications:push_subscribe" %}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
                        body: JSON.stringify(subscription.toJSON()),
                    });
                }).then(dismiss).catch(dismiss);
            });
        });
    })();
</script>
{% endif %}
