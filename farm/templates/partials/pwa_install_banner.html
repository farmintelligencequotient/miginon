{% load i18n static %}
<div id="pwa-install-banner" class="fixed inset-x-0 top-0 z-40 hidden w-full">
    <div class="w-full border-b border-emerald-100 bg-white px-4 py-5 shadow-soft dark:border-emerald-900 dark:bg-stone-900 sm:px-6">
        <div class="mx-auto flex max-w-3xl items-start gap-3">
            <img src="{% static 'images/logo-mark.svg' %}" alt="FarmIQ" class="h-10 w-10 shrink-0 rounded-xl">
            <div class="min-w-0 flex-1">
                <p class="text-sm font-bold text-stone-900 dark:text-stone-100">{% trans "Install FarmIQ" %}</p>

                <p id="pwa-banner-text-android" class="mt-1 hidden text-xs leading-relaxed text-stone-500 dark:text-stone-400">
                    {% trans "Add it to your home screen for quick, full-screen access - no browser bar, works like a real app." %}
                </p>

                <p id="pwa-banner-text-ios" class="mt-1 hidden text-xs leading-relaxed text-stone-500 dark:text-stone-400">
                    {% trans "Tap" %}
                    <span class="mx-0.5 inline-flex items-center justify-center rounded border border-stone-300 px-1 align-text-bottom text-[13px] text-stone-600 dark:border-stone-700 dark:text-stone-300">
                        <ion-icon name="share-outline"></ion-icon>
                    </span>
                    {% trans "Share, then scroll down and tap" %}
                    <span class="mx-0.5 inline-flex items-center gap-0.5 rounded border border-stone-300 px-1 align-text-bottom text-[13px] font-semibold text-stone-600 dark:border-stone-700 dark:text-stone-300">
                        <ion-icon name="add-outline"></ion-icon>{% trans "Add to Home Screen" %}
                    </span>.
                </p>

                <div class="mt-3 flex gap-2">
                    <button id="pwa-install-btn" type="button" class="hidden flex items-center gap-1.5 rounded-full bg-emerald-700 px-4 py-2 text-xs font-bold text-white hover:bg-emerald-800">
                        <ion-icon name="download-outline"></ion-icon> {% trans "Install" %}
                    </button>
                    <button id="pwa-dismiss-btn" type="button" class="rounded-full border border-stone-200 px-4 py-2 text-xs font-bold text-stone-600 hover:bg-stone-50 dark:border-stone-800 dark:text-stone-300 dark:hover:bg-stone-800">
                        {% trans "Not now" %}
                    </button>
                </div>
            </div>
            <button id="pwa-close-btn" type="button" class="shrink-0 text-stone-400 hover:text-stone-600 dark:text-stone-500 dark:hover:text-stone-300" aria-label="{% trans 'Dismiss' %}">
                <ion-icon name="close-outline" class="text-lg"></ion-icon>
            </button>
        </div>
    </div>
</div>

<script>
    (function () {
        var banner = document.getElementById('pwa-install-banner');
        if (!banner) return;

        var DISMISS_KEY = 'farmiq_pwa_banner_dismissed';
        if (localStorage.getItem(DISMISS_KEY)) return;

        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isStandalone) return;

        var ua = window.navigator.userAgent || '';
        var isIOS = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
        var isAndroid = /android/i.test(ua);
        if (!isIOS && !isAndroid) return; // desktop/unsupported: no banner

        var textAndroid = document.getElementById('pwa-banner-text-android');
        var textIOS = document.getElementById('pwa-banner-text-ios');
        var installBtn = document.getElementById('pwa-install-btn');
        var dismissBtn = document.getElementById('pwa-dismiss-btn');
        var closeBtn = document.getElementById('pwa-close-btn');

        function dismiss() {
            localStorage.setItem(DISMISS_KEY, '1');
            banner.classList.add('hidden');
        }
        dismissBtn.addEventListener('click', dismiss);
        closeBtn.addEventListener('click', dismiss);

        if (isIOS) {
            // iOS Safari has no install API at all - it's Share -> Add to
            // Home Screen, so just show the instructions.
            textIOS.classList.remove('hidden');
            banner.classList.remove('hidden');
            return;
        }

        // Android/Chrome: wait for the browser to confirm the app is
        // actually installable before showing anything.
        var deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferredPrompt = e;
            textAndroid.classList.remove('hidden');
            installBtn.classList.remove('hidden');
            banner.classList.remove('hidden');
        });

        installBtn.addEventListener('click', function () {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.finally(function () {
                deferredPrompt = null;
                dismiss();
            });
        });

        window.addEventListener('appinstalled', dismiss);
    })();
</script>
