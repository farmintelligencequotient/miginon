<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>{% block title %}Farm IQ{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f5f4; -webkit-text-size-adjust:100%;">
<span style="display:none; font-size:1px; color:#f5f5f4; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden;">
    {% block preheader %}{% endblock %}
</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f5f5f4;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px; background-color:#ffffff; border-radius:16px; overflow:hidden; box-shadow:0 10px 40px -12px rgba(20,84,60,0.18);">

                <tr>
                    <td style="background-color:#0f4531; padding:24px 32px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="width:34px; height:34px; background-color:rgba(255,255,255,0.12); border-radius:10px; text-align:center; font-size:18px; line-height:34px;">🌿</td>
                                <td style="padding-left:10px; font-family:'Segoe UI', Helvetica, Arial, sans-serif; font-size:18px; font-weight:800; color:#ffffff;">Farm IQ</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:36px 32px 8px; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
                        {% block content %}{% endblock %}
                    </td>
                </tr>

                <tr>
                    <td style="padding:24px 32px 32px;">
                        <div style="border-top:1px solid #e7e5e4; padding-top:20px; font-family:'Segoe UI', Helvetica, Arial, sans-serif;">
                            <p style="margin:0; font-size:12px; line-height:1.6; color:#a8a29e;">
                                You're receiving this because you have an account on Farm IQ{% if farm %} for {{ farm.name }}{% endif %}.
                            </p>
                            <p style="margin:6px 0 0; font-size:12px; color:#a8a29e;">
                                &copy; {{ current_year }} Farm IQ &middot; Smart dairy management, built for Kenyan farms.
                            </p>
                        </div>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
